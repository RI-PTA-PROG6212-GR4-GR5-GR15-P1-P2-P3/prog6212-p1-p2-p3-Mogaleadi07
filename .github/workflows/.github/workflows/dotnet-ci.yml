name: .NET build and test

on:
  push:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build all .NET projects
        shell: bash
        run: |
          find . -type f -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*' -print0 |
            while IFS= read -r -d '' project; do
              dotnet build "$project" --configuration Release
            done

      - name: Run all unit test projects
        shell: bash
        run: |
          find . -type f -name '*Tests.csproj' -not -path '*/obj/*' -not -path '*/bin/*' -print0 |
            while IFS= read -r -d '' project; do
              dotnet test "$project" --configuration Release
            done
